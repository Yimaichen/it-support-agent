[project]
name = "it-support-agent"
version = "0.1.0"
description = "Read-only conversational IT support agent (local take-home project)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "rank-bm25>=0.2.2,<0.3",
  "jieba==0.42.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["legacy_ledger: compatibility of persisted old step/provenance records; no legacy Agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
